name: homeyvibe-relay

services:
  relay:
    image: ghcr.io/fatedier/frps:v0.71.1
    command: ["-c", "/etc/frp/frps.toml"]
    restart: unless-stopped
    ports:
      - "443:8443/tcp"
      - "7000:7000/tcp"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - type: bind
        source: ./frps.toml
        target: /etc/frp/frps.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./cloud-credentials
        target: /run/relay
        read_only: true
        bind:
          create_host_path: false
