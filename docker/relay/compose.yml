name: homeyvibe-relay

services:
  relay:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    network_mode: host
    environment:
      TS_HOSTNAME: homeyvibe-relay
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_AUTHKEY: ${TS_AUTHKEY:-}
    volumes:
      - relay-state:/var/lib/tailscale

volumes:
  relay-state:
